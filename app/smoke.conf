# zephyr-desktop — the smoke build.
#
#   west build -b qemu_cortex_a53 app -d build-smoke -- -DEXTRA_CONF_FILE=smoke.conf
#
# Launches every discovered zapp, closes every window, and compares the client,
# handle, open-file and instance counts against the values captured at boot. It
# is the only automated proof that the load/unload path still works, and the
# only check that reaches it on a headless run.
#
# CLAUDE.md has documented this command since milestone K; the file it names was
# never committed, so the command has always failed at CMake time -- and because
# a failed configure leaves the previous build directory intact, `west build -t
# run` on it then executed the last good image and reported a pass. That is the
# stale-binary trap the same document warns about, arrived at from a new
# direction: not a filtered build log this time, but a build that never ran.

CONFIG_ZD_SMOKE_TEST=y

# The smoke build is the only configuration that deliberately holds every zapp
# open at once, so the desktop-wide window bound has to grow with the zapp
# count rather than with what a user would plausibly have on screen.
#
# Five zapps already take eight windows -- several open more than one -- so the
# default 8 was exactly full before clippy asked for a ninth, and the run failed
# with "window slab exhausted" rather than anything to do with clippy. Worth
# noting that the smoke test said so itself: it reported that the failure was
# "not the ABI gate refusing it", which is the check milestone M added after
# predicting this exact confusion.
#
# This does not weaken the leak detection. That works by comparing the client,
# handle, open-file and instance counts against the values captured at boot;
# slab exhaustion is a symptom it never relied on. The default stays 8 for every
# build a user runs, which is where the bound is doing its real job.
CONFIG_ZD_MAX_CLIENTS=16
