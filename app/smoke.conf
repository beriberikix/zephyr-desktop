# zephyr-desktop — the smoke build.
#
#   west build -b qemu_cortex_a53 app -d build-smoke -- -DEXTRA_CONF_FILE=smoke.conf
#
# Launches every discovered zapp, closes every window, and compares the client,
# handle, open-file and instance counts against the values captured at boot. It
# is the only automated proof that the load/unload path still works, and the
# only check that reaches it on a headless run.
#
# CLAUDE.md has documented this command since milestone K; the file it names was
# never committed, so the command has always failed at CMake time -- and because
# a failed configure leaves the previous build directory intact, `west build -t
# run` on it then executed the last good image and reported a pass. That is the
# stale-binary trap the same document warns about, arrived at from a new
# direction: not a filtered build log this time, but a build that never ran.

CONFIG_ZD_SMOKE_TEST=y
