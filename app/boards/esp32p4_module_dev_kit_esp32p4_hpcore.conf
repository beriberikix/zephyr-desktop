# Waveshare ESP32-P4-Module-DEV-KIT — RISC-V, and the project's third
# architecture after arm64 and Xtensa.
#
# The board DTS chooses everything the desktop looks for -- zephyr,display =
# &dsi_display and zephyr,touch = &gt911 -- so the panel and the touch
# controller wire themselves up the same way virtio_input0 does under QEMU.
#
# The panel is 800x1280 and PORTRAIT. The JD9365 has mirror bits but no
# transpose, so there is no way to rotate it in the panel; the desktop draws
# in the panel's own orientation and the taskbar lands along a 800 px edge.

CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_STACK_SENTINEL=y

# --- The SRAM budget, which is the whole story on this board -------------------
#
# v1.3 silicon carves the L2 cache off the TOP of HP SRAM while the floor is
# fixed at 0x4ff40000, so usable SRAM is 0x4ffc0000 - cache - 0x4ff40000: 384 KB
# at the default 128 KB of cache. The v3.x parts anchor the cache at the bottom
# and have 768 KB to spend. So everything that would sit in SRAM on another
# board has to be justified here, and the two big ones -- the llext heap and the
# filesystem -- are sized rather than copied from the QEMU target.
#
# The QEMU target uses a 384 KB llext heap. That is the entire SRAM budget here,
# so it is sized instead: the six zapps come to 59 KB of RISC-V .llext, and llext
# prices 4 KB-aligned REGIONS rather than bytes, so the cost tracks the number of
# segments per extension rather than the size of the files. 128 KB is roughly
# double the file bytes, which is the same ratio the CoreS3 runs at (88 KB of
# split heaps for the same six).
#
# If a zapp stops launching after another one is added, look here first: the
# failure is "Failed to copy regions, ret -12" out of llext_load(), which looks
# exactly like a corrupt extension.
CONFIG_LLEXT_HEAP_SIZE=128

# --- Display and LVGL ---------------------------------------------------------
#
# Render at the panel's native RGB888 straight into the framebuffers the DSI
# driver owns, so presenting a frame swaps a buffer instead of copying one. The
# copy is not a rounding error at this size: a full screen is 3 MB, and going
# through a buffer of our own measured 120-190 ms per frame against under 1 ms
# for a swap.
CONFIG_LV_COLOR_DEPTH_24=y
# --- Landscape -----------------------------------------------------------
#
# The panel is 800x1280 the tall way and cannot be turned: the DPI scanout
# streams the framebuffer as laid out, and a DSI video-mode panel has no
# transpose -- MADCTL's row/column exchange means nothing to a panel that
# displays the raster it is handed rather than holding a frame. LVGL will not
# do it either; its core rotates only through the draw matrix, which the
# software renderer does not implement.
#
# So the display driver rotates on the way to the scanout buffer, with the
# PPA rather than the CPU, and everything above it sees a 1280x800 display.
CONFIG_DISPLAY_ESP32_DSI_ROTATION=270

# The PPA's blocking wait defaults to 100 ms, which was not sized for a whole
# 1280x800 RGB888 quarter turn: that measured 82-93 ms here, so the margin was
# 7% and a frame that ran a little long timed out. A timed-out transaction
# leaves the engine mid-operation and every rotate after it fails too, so the
# picture freezes on the last good frame rather than degrading.
CONFIG_ESP32_PPA_WAIT_TIMEOUT_US=1000000

# The buffer handed to the driver is now landscape, so it can no longer be one
# of the driver's own framebuffers -- those have the panel's orientation.
# LVGL allocates its own pair instead, and they have to be whole screens
# because a partial rotate would leave the rest of the destination stale.
CONFIG_LV_Z_DIRECT_RENDERING=y
CONFIG_LV_Z_DOUBLE_VDB=y

# Those two buffers are 3 MB each and would otherwise be .bss -- which is SRAM,
# of which this silicon has 384 KB in total. .lvgl_buf is the tag Espressif's
# linker script routes to .ext_ram.data, so they land in PSRAM instead. Same
# reason the CoreS3 fragment sets it.
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y

# Flush from the LVGL thread. The flush thread hands the buffer to the driver
# from a second thread and never calls lv_display_flush_ready(), so LVGL is free
# to render the next frame into a buffer the driver has not finished presenting.
CONFIG_LV_Z_FLUSH_THREAD=n

# The widget pool goes to PSRAM via .lvgl_heap, which the SoC linker script
# routes into external RAM. It does not compete with the SRAM budget above.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
# The renderer's intermediate allocations scale with the screen, and running
# the pool dry faults inside them.
CONFIG_LV_Z_MEM_POOL_SIZE=3145728

# --- Touch --------------------------------------------------------------------
#
# The panel's 22-pin FPC carries 3V3, I2C and the MIPI lanes and no control
# lines at all, so the GT911 has no interrupt to raise and is polled. The board
# Kconfig.defconfig turns INPUT_GT911_INTERRUPT off for that reason.
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y

# Win95 chrome is mouse-sized and this is a fingertip on a 10 inch panel.
CONFIG_ZD_TOUCH_SLOP_PX=12

# --- Storage: the microSD card --------------------------------------------
#
# The card is on the SDMMC host in 4-bit mode (clk 43, cmd 44, d0-d3 39-42,
# with power switched by GPIO45), so unlike the CoreS3 nothing here shares a
# pin with the display -- that board's LCD drives the same GPIO as SPI MISO and
# needs ZD_SPI_DC_MISO_ARBITER to borrow it back. A DSI panel touches none of
# these, so the card is reached directly and there is no arbiter on this board.
CONFIG_ZD_FS_ROOT="/SD:"
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_DISK_DRIVER_RAM=n

# Never reformat someone's card because we failed to read it.
CONFIG_ZD_FS_AUTOFORMAT=n

# Write the built-in zapps to the card when they are absent, so a plain
# FAT-formatted card boots to a populated desktop. An existing file of the
# right size is left alone, so copying your own over them sticks.
CONFIG_ZD_SEED_BUILTIN_ZAPPS=y

CONFIG_MAIN_STACK_SIZE=16384

# --- Frame cost ---------------------------------------------------------
#
# Measured with CONFIG_ZD_DRAG_BENCH on this panel. A frame costs
#
#     29 ms  +  invalidated pixels / ~4 Mpx/s
#
# The 29 ms is a floor: a frame that repaints sixteen pixels costs 29.06 ms,
# and the configured timings scan out 880x1324 at 80 MHz in 14.56 ms, so the
# double-buffered present waits exactly two of them. Nothing that draws less
# gets under it -- a wireframe drag was tried and measured no faster than
# dragging the window, which is why there isn't one.
#
# So the only half worth attacking is the per-pixel half, and that is what
# the PPA does.

# Offload fill and image-blend to the Pixel Processing Accelerator. Measured
# 72.3 -> 57.8 ms on a drag frame and 291 -> 218 ms on a full repaint. It
# reaches the draw buffers over 2D-DMA, so they must be aligned to the L2
# cache line -- 64 bytes here, because this is v1.3 silicon with a 128 KB L2
# and the app needs the SRAM that a bigger cache would take.
CONFIG_LV_Z_DRAW_PPA_ESP32=y
CONFIG_LV_DRAW_BUF_ALIGN=64

# The input thread runs at the lowest priority by default, so it does not get
# to poll the touch controller until the frame in front of it is finished --
# and at 29 ms a frame minimum, the coordinates it then reads are stale. That
# reads as drag lag no matter how fast the rendering is. Make it cooperative
# and give the queues room for the samples that arrive during a long frame.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64

# LVGL's refresh timer also sets how often the pointer is sampled. At the
# default 33 ms the finger is read at 30 Hz while a drag frame takes longer
# than that anyway, so the position used is older than it needs to be.
CONFIG_LV_DEF_REFR_PERIOD=16
