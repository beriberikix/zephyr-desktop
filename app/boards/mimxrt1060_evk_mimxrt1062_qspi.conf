# mimxrt1060_evk — headless hardware checkpoint.
#
# Cortex-M7, arch "arm", so llext is supported and defaults to
# LLEXT_TYPE_ELF_OBJECT exactly as on the QEMU target. ARM_MPU is present, which
# means ARCH_HAS_USERSPACE -- the future hardening path is reachable here too.

CONFIG_DUMMY_DISPLAY=y

# Real files on a real card, rather than a build-time seed. This is the first
# point where a .llext arrives without the desktop image being rebuilt.
CONFIG_ZD_FS_ROOT="/SD:"
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_SUBSYS=y

# The RAM disk is a QEMU convenience; on hardware the card is the zapp store.
CONFIG_DISK_DRIVER_RAM=n

# No seeding here. The whole point of this checkpoint is that hello.llext
# arrives on the card from outside, so the desktop must find zapps it did not
# write itself.
CONFIG_ZD_SEED_BUILTIN_ZAPPS=n

# Formatting a user's SD card because we failed to read it would be a poor
# first impression. Fail the mount instead and say so.
#
# This has to be ZD_FS_AUTOFORMAT, which drives FS_MOUNT_FLAG_NO_FORMAT.
# Setting CONFIG_FS_FATFS_MKFS=n here does NOT work: FS_FATFS_MOUNT_MKFS
# defaults to y and selects it, so the assignment is silently overridden and
# the card gets formatted anyway. Verified by reading back the resolved
# .config, which still showed FS_FATFS_MKFS=y.
CONFIG_ZD_FS_AUTOFORMAT=n

# 128 MB of SDRAM on the EVK, but the LVGL pool and llext heap are the parts
# that actually matter; keep them the same as QEMU so footprint numbers compare.
CONFIG_LV_Z_MEM_POOL_SIZE=98304
CONFIG_LLEXT_HEAP_SIZE=128
