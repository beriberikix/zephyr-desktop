# qemu_cortex_a53: the single MVP target. Graphical via ramfb, pointer via
# virtio-tablet, llext-capable, and Zephyr's QEMU runner opens a cocoa window on
# macOS hosts.

# The board defconfig turns icount on "to avoid timing skew in tests". It makes
# the guest clock deterministic at the cost of feeling wrong under an
# interactive pointer, which is exactly what this project is.
CONFIG_QEMU_ICOUNT=n

# Stock is 8, and booting LVGL alone already warns "xlat tables low: 7 of 8 in
# use". The llext heap and the app instances still have to fit.
CONFIG_MAX_XLAT_TABLES=16

# ARM and ARM64 default to LLEXT_TYPE_ELF_OBJECT, which is a single compiler
# invocation and therefore exactly one source file per zapp. Notepad is not one
# source file, and neither is a zapp that shares zapps/lib/zlib.c with the
# others. Partial linking (ld -r) lifts that without changing anything a zapp
# can see.
#
# This lives in the board fragment rather than prj.conf because the binary type
# is a Kconfig *choice* whose default is per-architecture: Xtensa already
# defaults to LLEXT_TYPE_ELF_SHAREDLIB, which takes several sources as-is, so
# the CoreS3 must be left alone.
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
