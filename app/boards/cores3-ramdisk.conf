# Opt-in overlay config: run the CoreS3 off a RAM disk instead of the SD card.
#
#   west build -b m5stack_cores3/esp32s3/procpu app -d build-cores3 \
#       -- -DEXTRA_CONF_FILE=boards/cores3-ramdisk.conf
#
# Not the shipping configuration -- the whole point of a hardware target is that
# zapps arrive from outside. This exists so the Xtensa load path can be tested
# while the SD slot is not enumerating.

CONFIG_ZD_FS_ROOT="/RAM:"
CONFIG_DISK_DRIVER_RAM=y
CONFIG_ZD_SEED_BUILTIN_ZAPPS=y
CONFIG_ZD_FS_AUTOFORMAT=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FILE_SYSTEM_MKFS=y
