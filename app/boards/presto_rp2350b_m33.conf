# pimoroni_presto — the first target where SRAM is not where the zapps go.
#
# RP2350B: dual Cortex-M33, 520 KB of SRAM, 8 MB of APS6404 PSRAM mapped at
# 0x11000000, and a 480x480 panel whose framebuffer is 450 KB of that SRAM. The
# arithmetic does not work the usual way round -- there is no 384 KB left over
# for an llext heap -- so this board is the reason ZD_LLEXT_HEAP_REGION exists.
#
# Board support is out of tree (beriberikix/presto-zephyr, pinned in
# manifest/west.yml); app/CMakeLists.txt points BOARD_ROOT at it.

CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

# The llext heap goes to PSRAM, not SRAM. Note the absence of
# CONFIG_LLEXT_HEAP_SIZE: it depends on !LLEXT_HEAP_DYNAMIC, so setting it here
# would warn and do nothing -- the same silent no-op that cost the CoreS3 a
# whole milestone. ZD_LLEXT_HEAP_REGION_KB is the knob in this mode.
CONFIG_ZD_LLEXT_HEAP_REGION=y
CONFIG_ZD_LLEXT_HEAP_REGION_NAME="PSRAM"
CONFIG_ZD_LLEXT_HEAP_REGION_KB=384

# Zapp code is executed out of that PSRAM, so the region must be executable.
# The MPU is off by default on this SoC (CPU_HAS_ARM_MPU=y, ARM_MPU unset), so
# nothing marks it execute-never and this is free. Turning ARM_MPU on -- for
# MPU_STACK_GUARD, as the two NXP boards do -- would require the psram node's
# zephyr,memory-attr to become ATTR_MPU_EXTMEM rather than ATTR_MPU_RAM, or
# every zapp faults on its first instruction. Left off deliberately.

# 8 MB of PSRAM behind QMI window 1, brought up POST_KERNEL before main().
CONFIG_PIMORONI_RP2350_PSRAM=y

# LVGL's object pool and render buffer join it there. Same mechanism as the
# llext heap above -- a named linker region -- and between them they are why
# SRAM has room for the framebuffer at all.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="PSRAM"
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y

# 240x240, pixel-doubled to the 480x480 panel, and this is the one compromise in
# the port.
#
# Full resolution costs 450 KB of the 520 KB of SRAM, and the framebuffer is the
# one thing that cannot move to PSRAM -- it is scanned out continuously by DMA
# over the QMI bus shared with flash XIP, which underruns and tears. Everything
# else already went to PSRAM: LVGL's pool, its render buffer, the llext heap and
# even the RAM disk. What is left in SRAM after all that is 84 KB of kernel,
# stacks and driver state against the 70 KB that a full-res framebuffer would
# leave -- so full-res misses by about 13 KB.
#
# That 13 KB exists, but only in the stacks, and both candidates are load-bearing:
# SYSTEM_WORKQUEUE_STACK_SIZE is 4096 because 1024 overflowed and corrupted
# memory on the CoreS3, and MAIN_STACK_SIZE is 16384 with no recorded margin on a
# board where zapp code executes from PSRAM. Cutting either by guesswork is how
# that class of bug gets made. Measure the high-water mark with
# CONFIG_INIT_STACKS + CONFIG_THREAD_ANALYZER on hardware first; if the main
# thread turns out to have 16 KB to spare, drop this line and point zephyr,touch
# back at &ft6236 (the scaler exists only to halve coordinates for this mode).
#
# Single-buffered on purpose either way: LVGL writes only its dirty regions
# straight into the live framebuffer, which is the quiet path on a continuously
# -scanned DPI panel. The driver's own Kconfig explains at length why double
# buffering is the wrong tool for a partial-update GUI here.
CONFIG_ST7701_PRESTO_HALF_RES=y

# A 4in 480x480 panel is about 170 DPI, near enough the CoreS3's 320x240 2in
# panel that its slop carries over. Capacitive, and a real finger.
CONFIG_ZD_TOUCH_SLOP_PX=10

# USB CDC console. Not optional on this board in the way it is elsewhere: the
# display's data lanes take GP1, which is UART0 RX, so the only serial in is
# gone the moment the panel comes up -- and the board has no debug UART brought
# out besides. A silent board is the worst thing a board fragment can produce.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

# HWINFO is an `imply` of the USB device stack, and it does not build here:
# Zephyr main's hwinfo_rpi_pico.c wants POWMAN_CHIP_RESET_HAD_WATCHDOG_RESET_RSM
# _BITS while the hal_rpi_pico revision Zephyr itself pins only defines the _PSM
# spelling. Upstream breakage, not ours; it costs only the USB serial-number
# descriptor. Revisit when the pin moves.
CONFIG_HWINFO=n

# Real files on a real card. The SD stack: an SPI-attached host controller, the
# card protocol layer, and the block device FATFS mounts.
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_DRIVER_RAM=n

CONFIG_ZD_FS_ROOT="/SD:"

# Seeding off, like the RT1024 and unlike the CoreS3. This board can stream a
# .llext straight off the card, so leaving seeding on would mean the desktop
# overwrote the card with its own embedded copies at every boot -- and the one
# property this project exists to demonstrate is that a zapp arrives on the
# filesystem *without* the desktop image being rebuilt. Copy a .llext onto the
# card and it appears in the launcher; that is the whole thesis.
CONFIG_ZD_SEED_BUILTIN_ZAPPS=n

# Never format a card we failed to read. Fail the mount and say so instead.
# Has to be ZD_FS_AUTOFORMAT: setting CONFIG_FS_FATFS_MKFS=n does not work,
# because FS_FATFS_MOUNT_MKFS defaults to y and selects it.
CONFIG_ZD_FS_AUTOFORMAT=n

# MPU_STACK_GUARD is not available here -- the MPU is off, and turning it on to
# get the guard would take the executable PSRAM region with it. That leaves
# STACK_SENTINEL, which depends on !MPU_STACK_GUARD and is therefore the only
# overflow detection this board can have. Worth having precisely because the
# stacks are the tightest thing in SRAM.
CONFIG_STACK_SENTINEL=y

# Input queues, sized for a digitiser whose events pass through them twice.
#
# The FT6236 reports continuously while a finger is down -- around 200 events a
# second -- and every one of them occupies the shared input queue twice, because
# the scaler consumes an event on the input thread and re-reports the scaled one
# into the same queue. A scaler therefore halves the effective depth, and 16 was
# not enough to survive a drag.
#
# Depth alone was never the real bug, though: the scaler used to re-report with
# K_FOREVER, which deadlocked the input thread against the queue only it drains
# as soon as that queue filled. Fixed in drivers/presto; these numbers stop it
# filling in the first place, which keeps the pointer smooth rather than merely
# alive.
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=32

# The input thread logs, and logging here is synchronous and formats on the
# caller's stack (see the LOG_MODE_IMMEDIATE note in prj.conf). 1024 is the same
# default that overflowed the system workqueue on the CoreS3 and corrupted
# memory, which is why prj.conf raises that one to 4096; the input thread is the
# same hazard on this board because touch traffic is what runs through it.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
