# M5Stack CoreS3 — ESP32-S3, and the project's second architecture.
#
# Worth having precisely because it is not ARM. Everything above the loader is
# arch-agnostic by construction; this is the board that proves it rather than
# asserting it. It is also the first target that is a self-contained device: a
# 320x240 capacitive touchscreen, an SD card and a battery, with no ribbon
# cables or host window involved.
#
# The board DTS already chooses everything the desktop looks for --
# zephyr,display = &ili9342c and zephyr,touch = &ft6336_touch -- so
# CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH wires the touch panel to LVGL with no
# code, exactly as virtio_input0 does under QEMU.

# --- The Xtensa constraint ----------------------------------------------------
#
# Xtensa requires writable llext storage (see Zephyr issue #75341; upstream's
# own test matrix excludes xtensa from every llext.readonly scenario with the
# comment "Xtensa needs writable storage"). Writable storage requires a loader
# implementing peek(), and llext_fs_loader sets .peek = NULL -- so the zapp
# cannot be streamed off the card the way it is on ARM.
#
# ZD_ZAPP_LOAD_VIA_BUFFER reads the .llext into a heap buffer first and uses
# llext_buf_loader instead. Discovery is untouched: the file is still found on
# a real filesystem, it just takes one hop through RAM. With 8 MB of PSRAM that
# costs nothing.
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_ZD_ZAPP_LOAD_VIA_BUFFER=y

# k_malloc() has to hold a whole zapp image while it loads, and the buffer stays
# allocated for the instance's whole life -- llext_buf_loader may reference
# straight into it. Not "~2 KB each" any more, which is what this said when
# there were three of them: files is 10 KB and mines is 13 KB, and the pool has
# to hold one copy per LIVE instance, not one at a time.
CONFIG_HEAP_MEM_POOL_SIZE=49152

# --- Storage: the microSD card, via a pin arbiter ------------------------------
#
# GPIO35 is wired to two things: SPI2 MISO for the card, and the LCD's D/C line
# (dc-gpios = <&gpio1 3>). The display driver claims it as an output at init, so
# out of the box the card never answers CMD8 and the mount fails -5 -- with any
# card. Upstream's answer for the CoreS3 SE variant is to disable the display.
#
# ZD_SPI_DC_MISO_ARBITER instead borrows the pin back around each filesystem
# operation and hands it straight back, the same trick M5GFX uses on Arduino.
# See app/src/host/bus_arb.c.
CONFIG_ZD_FS_ROOT="/SD:"
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SPI=y
CONFIG_DISK_DRIVER_RAM=n
CONFIG_ZD_SPI_DC_MISO_ARBITER=y

# Never reformat someone's card because we failed to read it.
CONFIG_ZD_FS_AUTOFORMAT=n

# Unlike the RT1060, seeding is on here. Writing the built-in zapps to the card
# when they are absent exercises the write path on the arbitrated bus, and it
# means a plain FAT-formatted card boots to a populated desktop. Delete them and
# copy your own to prove external delivery -- an existing file of the right size
# is left alone.
CONFIG_ZD_SEED_BUILTIN_ZAPPS=y

# --- Display, and the 8 MB of PSRAM behind it ---------------------------------
#
# 320x240 rather than 480x272. The chrome is built from fixed pixel constants,
# so it does not reflow -- see the note in docs/hardware.md about what fits.
#
# The DRAM segment here is far tighter than the 512 KB SRAM figure suggests: an
# early build overflowed dram0_0_seg by 24 KB and the LVGL pool had to be cut
# from the 96 KB the QEMU target uses to 32 KB. The module carries 8 MB of PSRAM
# that was sitting idle, so put LVGL there and take the pool back.
#
# QUAD, not OCT, and this matters: octal PSRAM on the ESP32-S3 claims GPIO33-37
# for the extra data lines, and this board drives its LCD and SD card on GPIO35,
# 36 and 37. An 8 MB part does not imply octal -- ESP-PSRAM64 is 64 Mbit over
# four lines, which is what leaves those pins free for the display bus.
# 80 MHz is available because the flash is already clocked there.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_80M=y

# Espressif's linker script collects .lvgl_heap* and .lvgl_buf* into the
# PSRAM-backed .ext_ram.data section, so these two options are all it takes to
# move both the widget pool and the rendering buffers off DRAM. Nothing in the
# desktop changes; LVGL keeps allocating from the same sys_heap.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEM_POOL_SIZE=98304

# --- Harvard llext heaps ------------------------------------------------------
#
# ESP32-S3 sets CONFIG_HARVARD, so LLEXT_HEAP_SIZE does not exist here -- the
# heap is split into separate instruction and data heaps. Setting the single
# LLEXT_HEAP_SIZE is not silently ignored, at least: Kconfig warns "was assigned
# the value '384' but got the value ''. Check these unsatisfied dependencies:
# (!HARVARD) (=n)." -- wrapped across two lines, which is why the first grep
# written for it never matched. The defaults, 4 KB instruction and 8 KB data,
# are far too small for three zapps.
#
# prj.conf no longer assigns LLEXT_HEAP_SIZE at all -- it moved to the two ARM
# board fragments -- so that warning is gone and tools/ci-check.sh can treat any
# remaining one as an error. It only warned here because a global assignment
# reaches a board that has no such symbol; that is the whole failure mode, and
# the fix is to stop assigning it globally rather than to learn to ignore it.
#
# And 24 KB each was sized for exactly that: three, of about 2 KB. There are now
# six, the largest of them 13 KB, and llext prices 4 KB-aligned REGIONS rather
# than bytes -- so the cost tracks the number of segments, not the size of the
# file. The ARM target needed 256 KB -> 384 KB for the same reason and at the
# same moment; this is that bump, in this board's currency.
#
# Note that these have to hold every zapp open AT ONCE, not the largest one. The
# ARM figure is set by the smoke test, which loads all six; here it is set by how
# many windows are open, and two Minesweepers plus Notepad is an ordinary
# afternoon.
#
# The failure mode if this is too small is worth recognising, because it does
# not name itself: llext reports "Failed to copy regions, ret -12" and the
# desktop reports a zapp that would not load, which looks exactly like a corrupt
# extension. If a zapp stops launching after another one is added, look here
# first.
#
# Sized rather than rounded up, because DRAM is the scarce thing here and the
# instruction heap is charged to BOTH segments. Measured: 24/24 with a 32 KB
# mem pool left dram0_0_seg at 51%, 48/40 with a 48 KB pool leaves it at 66%,
# and 64/64 with 64 KB took it to 80% -- on a board whose own history includes
# overflowing that segment by 24 KB. 66% is the deliberate stopping point.
CONFIG_LLEXT_INSTR_HEAP_SIZE=48
CONFIG_LLEXT_DATA_HEAP_SIZE=40

# The instruction heap lives in word-granular-access IRAM
# (ARCH_HAS_WORD_GRANULAR_ACCESS_INSTR_MEM is set for this SoC). Without this
# the IRAM heap faults during init, because heap setup would otherwise perform
# narrow, unaligned stores into instruction memory.
#
# Note this is the *second*, independent reason the buffer loader is required
# here: the docs state that only llext_buf_loader may be used when the
# instruction heap is in word-granular-access instruction memory.
CONFIG_SYS_HEAP_BIG_ONLY=y

# --- The export surface is NOT free here --------------------------------------
#
# prj.conf sets CONFIG_LLEXT_EXPORT_DEFAULT_GROUPS=n, which on ARM took the
# symbols visible to extensions from 172 to 1 and broke nothing: zapps reach
# everything through the vtable. That conclusion does not carry to Xtensa.
#
# Xtensa builds extensions as ELF *shared objects* rather than the relocatable
# objects ARM produces, and the compiler emits PLT entries for libc calls the
# ARM build never needed. Measured on the device:
#
#   llext: PLT: cannot find idx 3 name memset
#   llext: Failed to link, ret -2
#
# Re-enable just the LIBC group. Not the SYSCALL group: fs_open() and friends
# stay unexported, so the permission shim remains the only linkable route to the
# filesystem, which was the actual point of narrowing the surface.
CONFIG_LLEXT_EXPORT_SYMBOL_GROUP_LIBC=y

# --- Touch: polling, not interrupts -------------------------------------------
#
# The FT6336's interrupt reaches the SoC through a chain: touch INT -> AW9523B
# expander pin 10 -> the expander's own INT -> gpio0 21. On this board that
# chain does not deliver. Tested both ways with the workqueue stack overflow
# already fixed, so this is not the earlier crash in disguise: with
# INPUT_FT5336_INTERRUPT=y no touch reaches LVGL at all, and with polling the
# launcher works.
#
# The cost is an I2C read every 20 ms, which on a device with a screen and a
# battery is not worth a second thought.
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD_MS=20

# --- Touch ergonomics ---------------------------------------------------------
#
# Measured on the device: a tap aimed at the Start button reports x=54, y=239.
# The x is dead on; the y is three pixels below the button, whose drawn bounds
# are y 216..236. Win95 chrome is mouse-sized, and a 20 px control at the very
# bottom edge of a 240 px screen is not reachable with a fingertip.
#
# This grows the hit area of the small controls without changing a single drawn
# pixel, so the chrome stays exact and the targets become finger-sized.
CONFIG_ZD_TOUCH_SLOP_PX=12

CONFIG_MAIN_STACK_SIZE=16384

# The software canary. See qemu_cortex_a53.conf: this is a per-board knob
# because STACK_SENTINEL depends on !MPU_STACK_GUARD. It has already earned its
# place on this board, where an overflowing system workqueue corrupted memory
# and surfaced as a garbage pointer in main(), nowhere near the cause.
CONFIG_STACK_SENTINEL=y
