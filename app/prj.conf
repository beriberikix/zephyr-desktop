# zephyr-desktop — board-independent configuration.
# Board-specific bits live in boards/<board>.conf.

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LOG=y

# --- Display and LVGL ---------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_LVGL=y

# Gives us lvgl_lock()/lvgl_unlock(). Every path that touches LVGL from outside
# the desktop loop goes through these; see CLAUDE.md.
CONFIG_LV_Z_LVGL_MUTEX=y

CONFIG_LV_Z_MEM_POOL_SIZE=98304

# The retro chrome is drawn from bevels and text, not images. Montserrat 14 is
# the body font; 12 is the titlebar/taskbar font.
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# --- Input --------------------------------------------------------------------
# On qemu_cortex_a53 this picks up virtio_input0 via the board's `zephyr,touch`
# chosen node and turns it into an lv_indev with no code on our side.
CONFIG_INPUT=y

# --- Extensions ---------------------------------------------------------------
# Enabled from the skeleton onward, well before milestone F needs it, so that
# llext build and heap problems surface on their own rather than tangled up with
# the loader. arm64 defaults to LLEXT_TYPE_ELF_OBJECT.
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=128

# Narrow the export surface to exactly the desktop's own API.
#
# The default groups (UNASSIGNED, SYSCALL, LIBC) export 172 symbols, including
# fs_open() and the rest of the syscall surface -- so an app could bypass the
# permission shim entirely just by calling Zephyr directly. Turning them off
# leaves ONE exported symbol, zd_get_host_api, and cost nothing: apps reach
# everything through the vtable handed to init(), so they import nothing else.
#
# This does not make the shim a security boundary. Without an MMU a loaded
# extension is still trusted code in the kernel address space and can reach any
# address it can compute. What it does is make the shim the only *linkable*
# route, which is the difference between a contract and a suggestion.
CONFIG_LLEXT_EXPORT_DEFAULT_GROUPS=n

# WM tracing: window create/raise/focus/reap. Useful while the WM is being
# built; drop to INF once the loader lands.
CONFIG_ZD_LOG_LEVEL_DBG=y

# --- Filesystem ---------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y

# Without long filenames FAT is limited to 8.3, which caps extensions at three
# characters -- and every app binary ends in ".llext".
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=64

# Synchronous logging. The boot burst -- mount, install, selftest -- overflows
# the deferred log buffer and reports "13 messages dropped", which silently ate
# selftest results. A self-test whose FAIL line can be dropped is worse than no
# self-test, so correctness of the evidence beats logging throughput here.
CONFIG_LOG_MODE_IMMEDIATE=y
