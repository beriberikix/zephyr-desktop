# The first independent check this project has ever had.
#
# Everything it asserts has, until now, been asserted on one Mac with one SDK,
# in a workspace that was created by hand and never recreated. Two things follow
# from that and are the actual point of this file:
#
#   - `git clone && west init -l manifest && west update` is what the README
#     tells a stranger to run, and nobody has ever run it. .west/ is gitignored
#     and the working tree has been the workspace since day one. This job starts
#     from nothing every time.
#   - the checks themselves live in tools/ci-check.sh, not here, so that the
#     machine which has to fix a failure can reproduce it with one command.
#     Anything expressible only in YAML is glue, not a check.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      boards:
        description: >-
          Which configurations to build. "all" is what a PR runs; the rest are
          for iterating on one thing without waiting for four toolchains.
        type: choice
        default: all
        options: [all, clippy, qemu, net, cores3, rt1060, presto]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checked out at the workspace root with no `path:`, and that is
      # load-bearing rather than tidy. This repo IS the west topdir -- west.yml
      # lives in manifest/ precisely so it can be -- and the setup action runs
      # `west init -l <app-path>` followed by `west update` from the default
      # working directory. Checking out to a subdirectory puts .west one level
      # below where `west update` looks, and it dies with "no west workspace
      # found from ..." having just successfully created one. That is exactly
      # how the first run of this file failed.
      - name: Check out into the west topdir
        uses: actions/checkout@v4
        with:
          # Tags, so git describe can name the build. Without this the boot
          # banner on a release build would say the commit rather than v0.1.0.
          fetch-depth: 0

      - name: Set up west, the workspace and the Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          # The manifest repository, not the application. See manifest/west.yml.
          app-path: manifest
          toolchains: aarch64-zephyr-elf:arm-zephyr-eabi:xtensa-espressif_esp32s3_zephyr-elf
          # Reads zephyr/SDK_VERSION, so the SDK cannot drift from the pin.
          sdk-version: auto

      - name: Report what we are actually building against
        run: |
          west --version
          git describe --abbrev=12 --always --tags --dirty || true
          echo "zephyr pinned at $(git -C zephyr rev-parse --short=12 HEAD)"
          echo "sdk ${ZEPHYR_SDK_INSTALL_DIR:-<unset>} (want $(cat zephyr/SDK_VERSION))"

      # Four boards built pristine, both QEMU images run, every .llext's
      # imports checked, and the Kconfig warnings read per board. Exit status is
      # the number of failed checks.
      - name: Build every board and run every check
        env:
          # Empty on push and pull_request, which ci-check.sh reads as "all".
          ZD_CI_BOARDS: ${{ inputs.boards }}
        run: tools/ci-check.sh

      # Pixels, not console text. Every other check here asserts on what the
      # desktop *said*; a desktop that boots, logs everything expected and
      # draws nothing would pass all of them. These are also the images
      # docs/clippy.md refers to, so they are produced by the build rather
      # than pasted in from someone's laptop and never updated again.
      #
      # The derivation of where to click lives in the script, not here --
      # anything expressible only in YAML is glue, not a check.
      - name: Screenshot the desktop and clippy
        if: always()
        run: |
          for d in build-ci/clippy build-ci/net; do
            if [ -f "$d/zephyr/zephyr.elf" ]; then
              tools/shot-clippy.sh -d "$d" -o build-ci/shots                 || echo "shot-clippy exited $? (screenshots are not a gate)"
              exit 0
            fi
          done
          echo "no build with clippy in it; skipping the screenshots"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build-ci/shots/*
          if-no-files-found: warn

      - name: Keep the build logs, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-ci/*.log
          if-no-files-found: warn
