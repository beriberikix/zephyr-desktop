# zephyr-desktop west manifest (T2 star topology).
#
# Zephyr is pinned to a `main` commit, NOT a release tag. This is deliberate and
# load-bearing: the qemu_cortex_a53 display + pointer stack this project targets
# (drivers/input/input_virtio.c, the `zephyr,touch = &virtio_input0` chosen node,
# and the -device virtio-tablet-device wiring in board.cmake) landed 2026-06-15,
# after the v4.4.1 tag of 2026-06-10. No release tag contains it.
#
# e201b84b is the commit this project's recon was verified against.

manifest:
  self:
    path: manifest

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: beriberikix
      url-base: https://github.com/beriberikix

  projects:
    - name: zephyr
      remote: upstream
      revision: e201b84b04e4fab1844658e71da0b7e340f1cc82
      import:
        # Keep the workspace small; add modules as milestones need them.
        name-allowlist:
          - cmsis
          - cmsis_6
          - fatfs
          - hal_espressif # m5stack_cores3 (ESP32-S3)
          - hal_nxp   # milestone H: mimxrt1060_evk
          - hal_rpi_pico # pimoroni_presto (RP2350B)
          - littlefs
          - lvgl
          - picolibc
          - segger

    # The Pimoroni Presto board support, out of tree and not ours.
    #
    # This is a whole board port -- boards/pimoroni/presto plus a Zephyr module
    # at drivers/presto holding three drivers upstream Zephyr does not have: the
    # ST7701 panel in parallel-RGB (two PIO1 state machines and a DMA pair
    # scanning a framebuffer out as DPI), the APS6404 PSRAM behind QMI window 1,
    # and a WS2812 fork that can reach a data pin above GP31.
    #
    # It pins Zephyr v4.4.0 and we pin a main commit three months later, so its
    # own west.yml is deliberately NOT imported -- this workspace's Zephyr wins,
    # and the version skew is a thing to test rather than to inherit.
    - name: presto-zephyr
      remote: beriberikix
      revision: f2c97c3b75826f38f2a5dedb02a34f56af221b7e
      path: modules/presto-zephyr
